name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: autoproductimagery_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autoproductimagery_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service container only. CI never receives application secrets.
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/autoproductimagery_ci
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/autoproductimagery_ci
      PG_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/autoproductimagery_ci
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libatomic1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Verify Node runtime libraries
        run: |
          node --version
          libraries="$(ldd "$(command -v node)")"
          printf '%s\n' "$libraries"
          [[ "$libraries" == *"libatomic.so.1"* ]]
          [[ "$libraries" != *"not found"* ]]

      - name: Install dependencies
        run: npm ci

      - name: Test with PostgreSQL
        run: npm test

      - name: Typecheck
        run: npx nuxi typecheck

      - name: Build app
        run: npm run build

      - name: Build retention worker
        run: npm run build:retention

      - name: Check migrations
        run: npx drizzle-kit check

      - name: Check changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            git diff-tree --check --root HEAD
          else
            git diff --check "$BASE_SHA" HEAD
          fi
          git diff --check
